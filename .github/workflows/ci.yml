name: Build and Unit Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cap Gradle heap for the hosted runner
        # gradle.properties asks for 16 GB, the size of the whole runner.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Build debug APK
        id: build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        # :domain is a plain Kotlin module, so it has `test`, not testDebugUnitTest.
        run: ./gradlew testDebugUnitTest :domain:test --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Upload debug APK
        # Upload whenever the APK built, even if unrelated tests fail.
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: neruppu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
